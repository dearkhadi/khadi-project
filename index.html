<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Khadi</title>
<meta name="description" content="Автосборка меню на неделю, список покупок и КБЖУ — без лишних раздумий.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EAFBF5;
    --card:#FFFFFF;
    --ink:#163A3F;
    --ink-soft:#5C8884;
    --ink-faint:#A9CFC9;
    --line:#CDEFE4;
    --line-strong:#8FDDC9;
    --accent:#00C2A8;
    --accent-light:#3BE0C4;
    --accent-dark:#018F79;
    --accent-soft:#D4FBF1;
    --accent-ink:#04594C;
    --on-accent:#FFFFFF;
    --pine:#FFB627;
    --pine-soft:#FFF3D6;
    --pine-ink:#8A5A00;
    --berry:#FF5A66;
    --berry-soft:#FFE1E3;
    --cat-breakfast:#E8A400; --cat-breakfast-soft:#FFF3D6;
    --cat-lunch:#00A892; --cat-lunch-soft:#D4FBF1;
    --cat-dinner:#7C5CFF; --cat-dinner-soft:#ECE6FF;
    --cat-snack:#F23F86; --cat-snack-soft:#FFE3EE;
    --shadow:0 3px 0 var(--line-strong), 0 10px 22px rgba(10,60,50,0.08);
    --shadow-pop:0 5px 0 var(--accent-dark);
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#0E2429;
      --card:#163B3F;
      --ink:#EAFBF5;
      --ink-soft:#9FD1C8;
      --ink-faint:#5C8884;
      --line:#1F4C4F;
      --line-strong:#2A6B63;
      --accent:#2EEFC7;
      --accent-light:#6FFFDE;
      --accent-dark:#00B99B;
      --accent-soft:#1A4A42;
      --accent-ink:#D4FBF1;
      --on-accent:#06302A;
      --pine:#FFC857;
      --pine-soft:#3A2E12;
      --pine-ink:#FFE7B0;
      --berry:#FF7B86;
      --berry-soft:#3A1E22;
      --cat-breakfast:#FFC857; --cat-breakfast-soft:#3A2E12;
      --cat-lunch:#2EEFC7; --cat-lunch-soft:#123A33;
      --cat-dinner:#A68CFF; --cat-dinner-soft:#2A2147;
      --cat-snack:#FF8FC0; --cat-snack-soft:#3A1E2E;
      --shadow:0 3px 0 var(--line-strong), 0 12px 26px rgba(0,0,0,0.35);
      --shadow-pop:0 5px 0 var(--accent-dark);
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --paper:#0E2429;
    --card:#163B3F;
    --ink:#EAFBF5;
    --ink-soft:#9FD1C8;
    --ink-faint:#5C8884;
    --line:#1F4C4F;
    --line-strong:#2A6B63;
    --accent:#2EEFC7;
    --accent-light:#6FFFDE;
    --accent-dark:#00B99B;
    --accent-soft:#1A4A42;
    --accent-ink:#D4FBF1;
    --on-accent:#06302A;
    --pine:#FFC857;
    --pine-soft:#3A2E12;
    --pine-ink:#FFE7B0;
    --berry:#FF7B86;
    --berry-soft:#3A1E22;
    --cat-breakfast:#FFC857; --cat-breakfast-soft:#3A2E12;
    --cat-lunch:#2EEFC7; --cat-lunch-soft:#123A33;
    --cat-dinner:#A68CFF; --cat-dinner-soft:#2A2147;
    --cat-snack:#FF8FC0; --cat-snack-soft:#3A1E2E;
    --shadow:0 3px 0 var(--line-strong), 0 12px 26px rgba(0,0,0,0.35);
    --shadow-pop:0 5px 0 var(--accent-dark);
    color-scheme:dark;
  }
  *{box-sizing:border-box;}
  svg{stroke-linecap:round; stroke-linejoin:round;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Nunito', system-ui, sans-serif;
    margin:0;
  }
  h1,h2,h3,.btn,.chip,.pill,nav.tabbar button,.slot-name,.slot-type,.lib-name,.daystrip button,.eyebrow{
    font-family:'Fredoka', system-ui, sans-serif;
  }
  h1,h2,h3{font-weight:600; text-wrap:balance; margin:0;}
  .mono{font-family:'Fredoka', system-ui, sans-serif; font-weight:600; font-variant-numeric: tabular-nums;}
  #app-shell{
    max-width:480px;
    margin:0 auto;
    min-height:100%;
    display:flex;
    flex-direction:column;
  }
  .topbar{
    position:sticky;
    top:env(safe-area-inset-top,0px);
    background:linear-gradient(135deg, var(--accent-light), var(--accent));
    padding:16px 16px 18px;
    border-radius:0 0 28px 28px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    box-shadow:0 6px 18px rgba(4,60,50,0.18);
    z-index:5;
  }
  .topbar .eyebrow{
    font-size:11px;
    letter-spacing:0.04em;
    text-transform:uppercase;
    color:rgba(255,255,255,0.85);
    font-weight:500;
  }
  .topbar h1{font-size:21px; color:#fff;}
  .theme-btn{
    border:1.5px solid rgba(255,255,255,0.5);
    background:rgba(255,255,255,0.2);
    color:#fff;
    border-radius:999px;
    width:36px;height:36px;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    flex:none;
  }
  main{flex:1; padding:0 16px 112px;}
  .card{
    background:var(--card);
    border:2px solid var(--line);
    border-radius:26px;
    padding:16px;
    box-shadow:var(--shadow);
  }
  .stack{display:flex; flex-direction:column; gap:12px;}
  .row{display:flex; gap:10px;}
  .row.wrap{flex-wrap:wrap;}
  p{line-height:1.5; color:var(--ink-soft); margin:0;}
  label.field{display:flex; flex-direction:column; gap:6px; font-size:13px; color:var(--ink-soft);}
  input[type=text], input[type=number], select{
    font:inherit;
    padding:10px 12px;
    border-radius:14px;
    border:2px solid var(--line);
    background:var(--paper);
    color:var(--ink);
    width:100%;
  }
  input:focus-visible, select:focus-visible, button:focus-visible, .chip:focus-visible{
    outline:2px solid var(--accent);
    outline-offset:2px;
  }
  .btn, .chip, .icon-btn, .star-btn, .eye-btn, .daystrip button, .lib-card{
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .btn{
    font-weight:500;
    border-radius:18px;
    padding:13px 18px;
    border:2px solid transparent;
    cursor:pointer;
    text-align:center;
  }
  .btn-primary{background:linear-gradient(180deg, var(--accent-light), var(--accent)); color:var(--on-accent); box-shadow:var(--shadow-pop);}
  .btn-primary:active{transform:translateY(5px); box-shadow:none;}
  .btn-ghost{background:var(--card); color:var(--ink); border-color:var(--line); box-shadow:0 3px 0 var(--line);}
  .btn-ghost:active{transform:translateY(3px); box-shadow:none;}
  .btn-danger{background:var(--berry-soft); color:var(--berry); box-shadow:0 3px 0 var(--berry-soft);}
  .btn-danger:active{transform:translateY(3px); box-shadow:none;}
  .btn[disabled]{opacity:0.45; cursor:not-allowed;}
  .btn-sm{padding:9px 13px; font-size:13px; border-radius:14px;}
  .chip, .icon-btn, .star-btn, .eye-btn, .lib-card{ }
  .chip:active, .icon-btn:active, .star-btn:active, .eye-btn:active, .lib-card:active{transform:scale(0.93);}
  .chip{
    display:inline-flex; align-items:center; gap:6px;
    padding:8px 13px; border-radius:999px;
    border:2px solid var(--line); background:var(--card);
    font-size:13px; font-weight:500; cursor:pointer; color:var(--ink-soft);
    user-select:none;
  }
  .chip.active{background:var(--accent); border-color:var(--accent-dark); color:var(--on-accent);}
  .pill{
    display:inline-flex; align-items:center; padding:4px 11px; border-radius:999px;
    font-size:11px; font-weight:600; letter-spacing:.02em;
    background:var(--pine-soft); color:var(--pine-ink);
  }
  .pill.warn{background:var(--berry-soft); color:var(--berry);}
  .member-card{border:2px solid var(--line); border-radius:22px; padding:14px; background:var(--paper);}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .progress{height:8px; border-radius:999px; background:var(--line); overflow:hidden;}
  .progress > div{height:100%; background:linear-gradient(90deg, var(--accent-light), var(--accent)); border-radius:999px;}
  .hairline{height:1px; background:var(--line); border:0; margin:4px 0;}
  nav.tabbar{
    position:fixed;
    left:16px; right:16px; bottom:calc(10px + env(safe-area-inset-bottom,0px));
    max-width:448px; margin:0 auto;
    background:var(--card);
    border:2px solid var(--line);
    border-radius:24px;
    box-shadow:var(--shadow);
    padding:6px;
    display:flex;
    justify-content:space-between;
    z-index:10;
  }
  nav.tabbar button{
    background:none; border:none; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; gap:2px;
    color:var(--ink-faint); font-size:10px; font-weight:500;
    flex:1; padding:8px 2px; border-radius:16px;
    transition:transform .12s ease, background .12s ease, color .12s ease;
  }
  nav.tabbar button svg{width:20px; height:20px;}
  nav.tabbar button.active{color:var(--on-accent); background:var(--accent); transform:translateY(-3px); box-shadow:0 4px 0 var(--accent-dark);}
  .empty{
    text-align:center; padding:40px 16px; color:var(--ink-faint);
  }
  .toast{
    position:fixed; left:50%; transform:translateX(-50%); bottom:96px;
    background:var(--ink); color:var(--paper); padding:10px 16px; border-radius:14px;
    font-size:13px; font-weight:600; z-index:50; box-shadow:var(--shadow);
  }
  @media (max-width:420px){ .grid2{grid-template-columns:1fr;} }

  .daystrip{display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; margin:0 -2px;}
  .daystrip button{
    flex:none; border:2px solid var(--line); background:var(--card); color:var(--ink-soft);
    border-radius:16px; padding:8px 12px; font:inherit; font-weight:500; cursor:pointer; min-width:56px; text-align:center;
  }
  .daystrip button.active{background:var(--accent); color:var(--on-accent); border-color:var(--accent-dark); box-shadow:0 4px 0 var(--accent-dark); transform:translateY(-2px);}
  .daystrip button .dnum{display:block; font-family:'Fredoka',sans-serif; font-weight:600; font-size:15px;}
  .slot-card{border:2px solid var(--line); border-left-width:6px; border-radius:20px; padding:12px; background:var(--card); display:flex; gap:12px; align-items:center;}
  .slot-card .meta{flex:1; min-width:0;}
  .slot-type{font-size:11px; text-transform:uppercase; letter-spacing:.04em; font-weight:600;}
  .slot-name{font-weight:500; margin-top:2px; font-size:15px;}
  .slot-time{font-size:12px; color:var(--ink-soft); margin-top:2px;}
  .icon-btn{
    border:2px solid var(--line); background:var(--paper); border-radius:14px; width:38px; height:38px;
    display:flex; align-items:center; justify-content:center; cursor:pointer; flex:none; color:var(--ink-soft);
  }
  .icon-btn svg{width:17px; height:17px;}
  .balance-row{display:flex; align-items:center; gap:10px;}
  .balance-track{flex:1; height:12px; border-radius:999px; background:var(--line); overflow:hidden;}
  .balance-fill{height:100%; background:linear-gradient(90deg, var(--accent-light), var(--accent)); border-radius:999px;}
  .balance-fill.over{background:var(--berry);}
  .macro-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; text-align:center;}
  .macro-grid .mval{font-family:'Fredoka',sans-serif; font-weight:600; font-size:17px; font-variant-numeric:tabular-nums;}
  .macro-grid .mlabel{font-size:11px; color:var(--ink-faint); font-weight:600;}
  .gap-note{background:var(--berry-soft); color:var(--berry); border-radius:18px; padding:10px 12px; font-size:13px; border:2px solid var(--berry-soft);}
  .section-title{display:flex; align-items:center; justify-content:space-between;}
  .section-title h2{font-size:17px;}
  .search-input{position:relative;}
  .search-input input{padding-left:36px;}
  .search-input svg{position:absolute; left:11px; top:50%; transform:translateY(-50%); width:16px; height:16px; color:var(--ink-faint);}
  .lib-card{border:2px solid var(--line); border-left-width:6px; border-radius:20px; padding:12px; background:var(--card); display:flex; flex-direction:column; gap:6px; cursor:pointer; text-decoration:none; color:inherit;}
  .lib-card .lib-top{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
  .lib-card .lib-name{font-weight:500; color:var(--ink); font-size:15px;}
  .lib-card .lib-meta{font-size:12px; color:var(--ink-soft);}
  .lib-actions{display:flex; gap:6px; flex:none;}
  .star-btn, .eye-btn{border:none; background:none; cursor:pointer; color:var(--ink-faint); width:30px; height:30px; display:flex; align-items:center; justify-content:center; border-radius:10px;}
  .star-btn.active{color:var(--pine);}
  .eye-btn.active{color:var(--berry);}
  .star-btn svg, .eye-btn svg{width:18px; height:18px;}
  .shop-row{display:flex; align-items:center; gap:10px; padding:9px 2px; cursor:pointer; border-bottom:2px solid var(--line);}
  .shop-row:last-child{border-bottom:none;}
  .shop-check{width:24px; height:24px; border-radius:10px; border:2px solid var(--line); flex:none; display:flex; align-items:center; justify-content:center; color:transparent;}
  .shop-row.checked .shop-check{background:var(--accent); border-color:var(--accent-dark); color:#fff;}
  .shop-row.checked .shop-name{color:var(--ink-faint); text-decoration:line-through;}
  .shop-name{flex:1; color:var(--ink);}
  .shop-amount{font-family:'Fredoka',sans-serif; font-weight:600; color:var(--ink-soft); font-size:13px; font-variant-numeric:tabular-nums;}
  .prep-item{display:flex; justify-content:space-between; gap:10px; padding:8px 0; border-bottom:2px solid var(--line);}
  .prep-item:last-child{border-bottom:none;}
  .schedule-day{display:flex; flex-direction:column; gap:4px; padding:10px 0; border-bottom:2px solid var(--line);}
  .schedule-day:last-child{border-bottom:none;}
  .schedule-day .sd-head{font-weight:600; display:flex; justify-content:space-between; align-items:center;}
  .schedule-day .sd-line{font-size:13px; color:var(--ink-soft); display:flex; justify-content:space-between;}
</style>
</head>
<body>
<div id="app-shell">
  <div class="topbar">
    <div>
      <div class="eyebrow" id="topbar-eyebrow">Khadi</div>
      <h1 id="topbar-title">Сегодня</h1>
    </div>
    <button class="theme-btn" id="theme-toggle" aria-label="Тема" title="Переключить тему"></button>
  </div>
  <main id="app"></main>
  <nav class="tabbar" id="tabbar" hidden></nav>
</div>
<div id="toast-root"></div>

<script>
'use strict';

/* ---------- storage ---------- */
var STORAGE_KEY = 'khadi_state_v1';

function uid(){ return Math.random().toString(36).slice(2,10); }

function defaultMember(first){
  return {
    id: uid(),
    name: first ? 'Я' : 'Без имени',
    sex: 'female',
    age: 30,
    height: 165,
    weight: 65,
    activity: 'light',
    goal: 'maintain',
    pregnant: false,
    lactating: false,
    medicalDiet: false,
    manualKcal: null
  };
}

function defaultState(){
  return {
    onboarded: false,
    onboardStep: 0,
    members: [defaultMember(true)],
    meals: { breakfast:true, lunch:true, dinner:true, snack:true },
    restrictions: { diet: [], allergies: [], excludedText: '', dislikedText: '' },
    equipment: { oven:true, multicooker:false, blender:true },
    timeWeekday: 30,
    timeWeekend: 60,
    prepDayIndex: 6,
    budget: 'medium',
    favorites: [],
    excludedDishes: [],
    pantryHave: {},
    recentMainIds: [],
    currentMenu: null,
    theme: 'system'
  };
}

function loadState(){
  try{
    var raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return null;
    var parsed = JSON.parse(raw);
    if(!parsed || typeof parsed !== 'object') return null;
    return parsed;
  }catch(e){ return null; }
}

function saveState(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){ /* storage unavailable: app still works this session */ }
}

var state = loadState() || defaultState();

/* ---------- theme ---------- */
function applyTheme(){
  var root = document.documentElement;
  if(state.theme === 'light'){ root.setAttribute('data-theme','light'); }
  else if(state.theme === 'dark'){ root.setAttribute('data-theme','dark'); }
  else { root.removeAttribute('data-theme'); }
  var btn = document.getElementById('theme-toggle');
  var icons = {
    system: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
    light: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
    dark: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z"/></svg>'
  };
  btn.innerHTML = icons[state.theme] || icons.system;
}
document.getElementById('theme-toggle').addEventListener('click', function(){
  var order = ['system','light','dark'];
  var next = order[(order.indexOf(state.theme)+1) % order.length];
  state.theme = next;
  saveState();
  applyTheme();
  toast(next==='system' ? 'Тема: как в системе' : (next==='light' ? 'Тема: светлая' : 'Тема: тёмная'));
});
applyTheme();

/* ---------- toast ---------- */
var toastTimer = null;
function toast(msg){
  var root = document.getElementById('toast-root');
  root.innerHTML = '<div class="toast">'+escapeHtml(msg)+'</div>';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ root.innerHTML=''; }, 2200);
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

/* ---------- routing ---------- */
var TABS = [
  { key:'today', label:'Сегодня', icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>' },
  { key:'week', label:'Неделя', icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 3v3M16 3v3"/><path d="M7 13h2M11 13h2M15 13h2M7 17h2M11 17h2"/></svg>' },
  { key:'shopping', label:'Покупки', icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 8h12l-1.2 11.2a2 2 0 0 1-2 1.8H9.2a2 2 0 0 1-2-1.8L6 8Z"/><path d="M9 8a3 3 0 0 1 6 0"/></svg>' },
  { key:'prep', label:'Заготовки', icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>' },
  { key:'library', label:'Блюда', icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19.5V5a2 2 0 0 1 2-2h12.5v17H6a2 2 0 0 0-2 2Z"/><path d="M8 7h8"/></svg>' },
  { key:'profile', label:'Я', icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="3.4"/><path d="M4.5 20a7.5 7.5 0 0 1 15 0"/></svg>' }
];

function renderTabbar(active){
  var nav = document.getElementById('tabbar');
  if(!state.onboarded){ nav.hidden = true; return; }
  nav.hidden = false;
  nav.innerHTML = TABS.map(function(t){
    return '<button data-nav="'+t.key+'" class="'+(t.key===active?'active':'')+'">'+t.icon+'<span>'+t.label+'</span></button>';
  }).join('');
  Array.prototype.forEach.call(nav.querySelectorAll('button'), function(btn){
    btn.addEventListener('click', function(){ location.hash = btn.getAttribute('data-nav'); });
  });
}

var TITLES = { today:'Сегодня', week:'Неделя', shopping:'Покупки', prep:'Заготовки', library:'Блюда', profile:'Я', onboarding:'Знакомство' };

var lastTab = 'today';
function route(){
  var hash = location.hash.replace('#','') || (state.onboarded ? 'today' : 'onboarding');
  if(!state.onboarded && hash !== 'onboarding'){ location.hash = 'onboarding'; return; }
  if(TABS.some(function(t){ return t.key===hash; })) lastTab = hash;
  document.getElementById('topbar-title').textContent = TITLES[hash] || 'Khadi';
  document.getElementById('topbar-eyebrow').textContent = state.onboarded ? 'Khadi · меню на неделю' : 'Khadi';
  renderTabbar(hash.indexOf('dish-')===0 ? lastTab : hash);
  var app = document.getElementById('app');
  if(hash === 'onboarding') renderOnboarding(app);
  else if(hash === 'today') renderToday(app);
  else if(hash === 'week') renderWeek(app);
  else if(hash.indexOf('dish-')===0) renderDishDetail(app, hash.slice(5));
  else if(hash === 'shopping') renderShopping(app);
  else if(hash === 'prep') renderPrep(app);
  else if(hash === 'library') renderLibrary(app);
  else if(hash === 'profile') renderProfile(app);
  else renderPlaceholder(app, 'Khadi', 'Экран не найден.');
  window.scrollTo(0,0);
}

function bindMemberCard(card, m, onAnyChange){
  function refreshDerived(){
    var maleSex = m.sex==='male';
    Array.prototype.forEach.call(card.querySelectorAll('[data-female-only]'), function(el){ el.hidden = maleSex; });
    var manualBlock = card.querySelector('[data-manual-block]');
    if(manualBlock) manualBlock.hidden = !memberNeedsManual(m);
    if(onAnyChange) onAnyChange(m, false);
  }
  Array.prototype.forEach.call(card.querySelectorAll('[data-f]'), function(el){
    var ev = (el.tagName==='SELECT') ? 'change' : 'input';
    el.addEventListener(ev, function(){
      var f = el.getAttribute('data-f');
      if(f==='name') m.name = el.value || 'Без имени';
      else if(f==='manualKcal') m.manualKcal = el.value ? Number(el.value) : null;
      else if(f==='age' || f==='height' || f==='weight') m[f] = Number(el.value)||0;
      else m[f] = el.value;
      if(f==='sex' && m.sex==='male'){
        m.pregnant = false; m.lactating = false;
        var pc = card.querySelector('[data-toggle="pregnant"]'); if(pc) pc.classList.remove('active');
        var lc = card.querySelector('[data-toggle="lactating"]'); if(lc) lc.classList.remove('active');
      }
      saveState();
      refreshDerived();
    });
  });
  Array.prototype.forEach.call(card.querySelectorAll('[data-toggle]'), function(chip){
    chip.addEventListener('click', function(){
      var key = chip.getAttribute('data-toggle');
      m[key] = !m[key];
      chip.classList.toggle('active');
      saveState();
      refreshDerived();
    });
  });
  var removeBtn = card.querySelector('[data-remove]');
  if(removeBtn){
    removeBtn.addEventListener('click', function(){
      state.members = state.members.filter(function(x){ return x.id!==m.id; });
      saveState();
      if(onAnyChange) onAnyChange(null, true);
    });
  }
}

      });
    });
    document.getElementById('budget-select').addEventListener('change', function(e){ state.budget = e.target.value; saveState(); });
    actions.innerHTML = navButtons(idx);
    bindNav(idx, goTo);
  }

  if(stepKey === 'schedule'){
    body.innerHTML =
      '<h2>Время на готовку</h2>'+
      '<label class="field">В будни, минут на приём пищи<input type="number" min="5" max="180" value="'+state.timeWeekday+'" id="time-weekday"></label>'+
      '<label class="field">В выходные, минут на приём пищи<input type="number" min="5" max="240" value="'+state.timeWeekend+'" id="time-weekend"></label>'+
      '<label class="field">День для заготовок<select id="prep-day">'+WEEKDAYS_RU.map(function(d,i){ return '<option value="'+i+'"'+(state.prepDayIndex===i?' selected':'')+'>'+d+'</option>'; }).join('')+'</select></label>';

    actions.innerHTML = navButtons(idx);
    bindNav(idx, goTo);

  if(stepKey === 'done'){
    body.innerHTML =

      '<div class="card stack">'+

        '<p>Приёмы пищи: '+Object.keys(state.meals).filter(function(k){return state.meals[k];}).map(function(k){ return ({breakfast:'завтрак',lunch:'обед',dinner:'ужин',snack:'перекус'})[k]; }).join(', ')+'</p>'+

function exportCode(){
  var json = JSON.stringify({ v:1, state:state });
  return btoa(unescape(encodeURIComponent(json)));
}
function parseImportCode(code){
  try{
    var json = decodeURIComponent(escape(atob(code.trim())));
    var payload = JSON.parse(json);
    if(!payload || payload.v!==1 || !payload.state || !payload.state.members) return null;
    return payload.state;
  }catch(e){ return null; }
}

    location.hash = 'onboarding';
    route();
  });
  document.getElementById('add-member-profile').addEventListener('click', function(){
    state.members.push(defaultMember(false));
    saveState();
    renderProfile(app);
  });
  Array.prototype.forEach.call(app.querySelectorAll('[data-pmember]'), function(details){
    var id = details.getAttribute('data-pmember');
    var m = state.members.find(function(x){ return x.id===id; });
    if(!m) return;
    var card = details.querySelector('.member-card');
    bindMemberCard(card, m, function(mm, removed){
      if(removed){ renderProfile(app); return; }
      var sumEl = document.getElementById('target-sum-'+m.id);
      if(sumEl) sumEl.innerHTML = targetSummaryHtml(m);
      var pillEl = document.getElementById('pill-'+m.id);
      if(pillEl) pillEl.outerHTML = memberPillHtml(m);
      var pnameEl = document.getElementById('pname-'+m.id);
      if(pnameEl) pnameEl.textContent = m.name;
      var pmetaEl = document.getElementById('pmeta-'+m.id);
      if(pmetaEl) pmetaEl.textContent = ' · '+(m.sex==='female'?'жен.':'муж.')+', '+m.age+' лет';
    });
  });
  Array.prototype.forEach.call(app.querySelectorAll('[data-theme-opt]'), function(chip){
    chip.addEventListener('click', function(){
      state.theme = chip.getAttribute('data-theme-opt');
      saveState(); applyTheme(); renderProfile(app);
    });
  });
  document.getElementById('copy-code').addEventListener('click', function(){
    copyToClipboard(document.getElementById('export-code').value);
  });
  var importBtn = document.getElementById('import-code-btn');
  importBtn.addEventListener('click', function(){
    var code = document.getElementById('import-code').value;
    if(!code.trim()){ toast('Вставьте код'); return; }
    if(!profileImportArmed){
      profileImportArmed = true;
      importBtn.textContent = 'Точно восстановить? Это заменит текущие данные';
      return;
    }
    var restored = parseImportCode(code);
    if(!restored){ toast('Код не распознан — проверьте, что он скопирован полностью'); profileImportArmed=false; importBtn.textContent='Восстановить из кода'; return; }
    state = restored;
    saveState(); applyTheme();
    toast('Данные восстановлены');
    location.hash = 'today';
    route();
  });
}

function buildIngredients(raw){
  var out = {};
  for(var id in raw){
    var arr = raw[id];
    var o = { id:id };
    for(var i=0;i<ING_FIELDS.length;i++) o[ING_FIELDS[i]] = arr[i];
    out[id] = o;
  }
  return out;
}

/* =========================================================
   РАСЧЁТ НОРМ И НУТРИЕНТОВ
   ========================================================= */
var ACTIVITY_FACTORS = { sedentary:1.2, light:1.375, moderate:1.55, active:1.725, veryActive:1.9 };
var GOAL_ADJUST = { lose:-0.15, maintain:0, gain:0.12 };
var SAFE_MIN = { male:1500, female:1200 };
var RDA = {
  male:   { vitC:90, vitA:900, vitD:15, b12:2.4, iron:8,  calcium:1000 },
  female: { vitC:75, vitA:700, vitD:15, b12:2.4, iron:18, calcium:1000 }
};
var MICRO_LABELS = { vitC:'Витамин C', vitA:'Витамин A', vitD:'Витамин D', b12:'B12', iron:'Железо', calcium:'Кальций' };

function bmr(m){
  return m.sex==='male' ? (10*m.weight+6.25*m.height-5*m.age+5) : (10*m.weight+6.25*m.height-5*m.age-161);
}

function deriveMacros(kcal, note){
  var protein = kcal*0.25/4;
  var fat = kcal*0.3/9;
  var carb = Math.max(0, (kcal - protein*4 - fat*9)/4);
  return { kcal:Math.round(kcal), protein:Math.round(protein), fat:Math.round(fat), carb:Math.round(carb), blocked:false, note:note||null };
}

function blockReason(m){
  if(m.age<18) return 'младше 18 лет — автоматический расчёт не проводится';
  if(m.pregnant) return 'беременность — нужна норма от врача';
  if(m.lactating) return 'лактация — нужна норма от врача';
  if(m.medicalDiet) return 'назначенная диета — используйте норму от специалиста';
  return 'нужна норма вручную';
}

function computeMemberTargets(m){
  var blocked = memberNeedsManual(m);
  if(blocked){
    if(m.manualKcal) return deriveMacros(m.manualKcal, null);
    return { kcal:null, protein:null, fat:null, carb:null, blocked:true, reason: blockReason(m) };
  }
  var tdee = bmr(m) * ACTIVITY_FACTORS[m.activity];
  var target = tdee * (1 + GOAL_ADJUST[m.goal]);
  var minKcal = SAFE_MIN[m.sex];
  var note = null;
  if(target < minKcal){ target = minKcal; note = 'расчёт ниже безопасного минимума — применён минимум, рекомендуем консультацию специалиста'; }
  return deriveMacros(target, note);
}

function rdaFor(m){ return RDA[m.sex] || RDA.female; }

function householdTargets(){
  var totalKcal=0, totalProtein=0, totalFat=0, totalCarb=0;
  var micro = { vitC:0, vitA:0, vitD:0, b12:0, iron:0, calcium:0 };
  var warnings = [];
  state.members.forEach(function(m){
    var t = computeMemberTargets(m);
    if(t.blocked){
      totalKcal+=2000; totalProtein+=90; totalFat+=65; totalCarb+=230;
      warnings.push(m.name+': норма не рассчитана ('+t.reason+'). Используется усреднённое значение, пока норма не указана вручную в профиле.');
    } else {
      totalKcal+=t.kcal; totalProtein+=t.protein; totalFat+=t.fat; totalCarb+=t.carb;
      if(t.note) warnings.push(m.name+': '+t.note);
    }
    var r = rdaFor(m);
    for(var k in micro) micro[k]+=r[k];
  });
  return { kcal:totalKcal, protein:totalProtein, fat:totalFat, carb:totalCarb, micro:micro, warnings:warnings };
}

var NUTRIENT_KEYS = ['kcal','protein','fat','carb','fiber','vitC','vitA','vitD','b12','iron','calcium'];

function dishTotals(d){
  var t = {}; NUTRIENT_KEYS.forEach(function(k){ t[k]=0; });
  d.ing.forEach(function(it){
    var ing = INGREDIENTS[it.id];
    var f = it.g/100;
    NUTRIENT_KEYS.forEach(function(k){ t[k] += (ing[k]||0)*f; });
  });
  return t;
}
function dishPerServing(d){
  var t = dishTotals(d), out = {};
  NUTRIENT_KEYS.forEach(function(k){ out[k] = t[k]/d.servingsBase; });
  return out;
}

function dishFlags(d){
  var f = { vegan:true, vegetarian:true, pescatarian:true, glutenFree:true, lactoseFree:true, halal:true,
            hasVeg:false, hasNut:false, hasEgg:false, hasFish:false, hasDairy:false, hasSoy:false, hasGluten:false };
  d.ing.forEach(function(it){
    var ing = INGREDIENTS[it.id], g = ing.group;
    if(g==='poultry'||g==='meat'||g==='fish'||g==='egg'||g==='dairy'||it.id==='honey') f.vegan=false;
    if(g==='poultry'||g==='meat'||g==='fish') f.vegetarian=false;
    if(g==='poultry'||g==='meat') f.pescatarian=false;
    if(ing.gluten){ f.glutenFree=false; f.hasGluten=true; }
    if(ing.dairy){ f.lactoseFree=false; f.hasDairy=true; }
    if(g==='nut') f.hasNut=true;
    if(g==='egg') f.hasEgg=true;
    if(g==='fish') f.hasFish=true;
    if(ing.soy) f.hasSoy=true;
    if(g==='veg' && !STARCHY[it.id] && it.g>=30) f.hasVeg=true;
  });
  return f;
}

function dishAllowed(d){
  var f = dishFlags(d);
  var r = state.restrictions;
  if(r.diet.indexOf('vegetarian')>-1 && !f.vegetarian) return false;
  if(r.diet.indexOf('vegan')>-1 && !f.vegan) return false;
  if(r.diet.indexOf('pescatarian')>-1 && !f.pescatarian) return false;
  if(r.diet.indexOf('glutenFree')>-1 && !f.glutenFree) return false;
  if(r.diet.indexOf('lactoseFree')>-1 && !f.lactoseFree) return false;
  if(r.allergies.indexOf('dairy')>-1 && f.hasDairy) return false;
  if(r.allergies.indexOf('eggs')>-1 && f.hasEgg) return false;
  if(r.allergies.indexOf('nuts')>-1 && f.hasNut) return false;
  if(r.allergies.indexOf('fish')>-1 && f.hasFish) return false;
  if(r.allergies.indexOf('gluten')>-1 && f.hasGluten) return false;
  if(r.allergies.indexOf('soy')>-1 && f.hasSoy) return false;
  var banned = (r.excludedText+','+r.dislikedText).toLowerCase().split(',').map(function(s){return s.trim();}).filter(Boolean);
  if(banned.length){
    var names = d.ing.map(function(it){ return INGREDIENTS[it.id].name.toLowerCase(); });
    if(banned.some(function(b){ return names.some(function(n){ return n.indexOf(b)>-1; }); })) return false;
  }
  if(state.excludedDishes.indexOf(d.id)>-1) return false;
  if(d.equipment.indexOf('oven')>-1 && !state.equipment.oven) return false;
  if(d.equipment.indexOf('blender')>-1 && !state.equipment.blender) return false;
  if(d.equipment.indexOf('multicooker')>-1 && !state.equipment.multicooker) return false;
  return true;
}

function dishFitsTime(d, isWeekend){
  var budget = isWeekend ? state.timeWeekend : state.timeWeekday;
  return d.totalTime <= budget;
}

/* =========================================================
   ГЕНЕРАТОР МЕНЮ
   ========================================================= */
var MEAL_SHARE = { breakfast:0.25, lunch:0.35, dinner:0.30, snack:0.10 };
var SLOT_LABEL = { breakfast:'Завтрак', lunch:'Обед', dinner:'Ужин', snack:'Перекус' };
var SLOT_ORDER = ['breakfast','lunch','dinner','snack'];

function preferAnimalProtein(){
  var d = state.restrictions.diet;
  return d.indexOf('vegetarian')===-1 && d.indexOf('vegan')===-1;
}

function pickWeighted(list, biasAwayFromLegume){
  var weighted = list.map(function(d){
    var w = state.favorites.indexOf(d.id)>-1 ? 3 : 1;
    if(biasAwayFromLegume && d.mainProtein==='legume') w *= 0.45;
    return [d, w];
  });
  var total = weighted.reduce(function(s,p){ return s+p[1]; },0);
  var r = Math.random()*total;
  for(var i=0;i<weighted.length;i++){ r -= weighted[i][1]; if(r<=0) return weighted[i][0]; }
  return weighted[weighted.length-1][0];
}

function generateWeek(){
  var targets = householdTargets();
  var slotKeys = SLOT_ORDER.filter(function(k){ return state.meals[k]; });
  var sumShare = slotKeys.reduce(function(s,k){ return s+MEAL_SHARE[k]; },0) || 1;
  var days = [], gaps = [];
  var usedThisWeek = {};
  var prevDishIds = {};
  var prevMainProtein = null;
  var headcount = state.members.length || 1;

  for(var di=0; di<7; di++){
    var isWeekend = di>=5;
    var isPrepDay = (di===state.prepDayIndex);
    var slots = {};

    slotKeys.forEach(function(slotKey){
      var dishType = slotKey==='breakfast' ? 'breakfast' : (slotKey==='snack' ? 'snack' : 'main');
      var pool = DISH_LIST.filter(function(d){ return d.type===dishType && dishAllowed(d) && dishFitsTime(d, isWeekend); });
      pool = pool.filter(function(d){ return prevDishIds[slotKey] !== d.id; });

      if(dishType==='main'){
        pool = pool.filter(function(d){ return state.recentMainIds.indexOf(d.id)===-1 && !usedThisWeek[d.id]; });
      }

      var chosenPool = pool;
      if(dishType==='main' && prevMainProtein){
        var rotated = pool.filter(function(d){ return d.mainProtein !== prevMainProtein; });
        if(rotated.length) chosenPool = rotated;
      }
      if(isPrepDay){
        var prepPool = chosenPool.filter(function(d){ return d.canPrepAhead; });
        if(prepPool.length) chosenPool = prepPool;
      } else if(!isWeekend && dishType==='main'){
        var quick = chosenPool.filter(function(d){ return d.totalTime <= state.timeWeekday; });
        if(quick.length) chosenPool = quick;
      }
      if(!chosenPool.length && dishType==='main'){
        var relaxed = DISH_LIST.filter(function(d){ return d.type===dishType && dishAllowed(d) && dishFitsTime(d, isWeekend) && prevDishIds[slotKey]!==d.id; });
        if(relaxed.length) chosenPool = relaxed;
      }
      if(!chosenPool.length){
        gaps.push(WEEKDAYS_RU[di]+', '+SLOT_LABEL[slotKey]+': не нашлось подходящего блюда под текущие условия (ограничения, время или оборудование). Попробуйте ослабить одно из условий в профиле.');
        slots[slotKey] = null;
        return;
      }
      var chosen = pickWeighted(chosenPool, dishType==='main' && preferAnimalProtein());
      var slotTargetKcal = targets.kcal * (MEAL_SHARE[slotKey]/sumShare);
      var perServ = dishPerServing(chosen);
      var servings = Math.max(headcount, Math.round(slotTargetKcal / (perServ.kcal||1)));
      servings = Math.min(servings, headcount*3);
      var scale = servings / chosen.servingsBase;
      slots[slotKey] = { dishId:chosen.id, servings:servings, scale:scale };
      prevDishIds[slotKey] = chosen.id;
      if(dishType==='main'){ usedThisWeek[chosen.id]=true; prevMainProtein = chosen.mainProtein; }
    });

    days.push({ dow:WEEKDAYS_RU[di], slots:slots });
  }

  return { days:days, gaps:gaps, targets:targets, createdAt:Date.now() };
}

function collectMainIds(menu){
  var ids = [];
  menu.days.forEach(function(day){
    ['lunch','dinner'].forEach(function(k){
      if(day.slots[k]) ids.push(day.slots[k].dishId);
    });
  });
  return ids;
}

function buildMenu(isNextWeek){
  if(isNextWeek && state.currentMenu){
    state.recentMainIds = collectMainIds(state.currentMenu);
  }
  state.currentMenu = generateWeek();
  saveState();
}

function replaceDishInSlot(dayIndex, slotKey){
  var menu = state.currentMenu;
  if(!menu) return;
  var day = menu.days[dayIndex];
  var current = day.slots[slotKey];
  var dishType = slotKey==='breakfast' ? 'breakfast' : (slotKey==='snack' ? 'snack' : 'main');
  var isWeekend = dayIndex>=5;
  var pool = DISH_LIST.filter(function(d){
    return d.type===dishType && dishAllowed(d) && dishFitsTime(d, isWeekend) && (!current || d.id!==current.dishId);
  });
  if(!pool.length){ toast('Нет других подходящих блюд под текущие условия'); return; }
  var chosen = pickWeighted(pool, dishType==='main' && preferAnimalProtein());
  var targets = menu.targets;
  var slotKeys = SLOT_ORDER.filter(function(k){ return state.meals[k]; });
  var sumShare = slotKeys.reduce(function(s,k){ return s+MEAL_SHARE[k]; },0) || 1;
  var slotTargetKcal = targets.kcal * (MEAL_SHARE[slotKey]/sumShare);
  var perServ = dishPerServing(chosen);
  var headcount = state.members.length || 1;
  var servings = Math.max(headcount, Math.round(slotTargetKcal/(perServ.kcal||1)));
  servings = Math.min(servings, headcount*3);
  day.slots[slotKey] = { dishId:chosen.id, servings:servings, scale:servings/chosen.servingsBase };
  saveState();
  toast('Заменено: '+chosen.name);
}

function dayTotals(day){
  var sum = {}; NUTRIENT_KEYS.forEach(function(k){ sum[k]=0; });
  SLOT_ORDER.forEach(function(k){
    var s = day.slots[k];
    if(!s) return;
    var t = dishTotals(DISHES[s.dishId]);
    NUTRIENT_KEYS.forEach(function(k2){ sum[k2]+= (t[k2]||0)*s.scale; });
  });
  return sum;
}

function pct(val, target){ return target ? Math.round(val/target*100) : 0; }

function formatAmount(ingId, grams){
  if(ingId==='eggs'){ var n = Math.max(1, Math.round(grams/EGG_G)); return n+' шт'; }
  var ing = INGREDIENTS[ingId];
  var unit = ing.unit==='ml' ? 'мл' : 'г';
  return Math.round(grams)+' '+unit;
}

function todayIndex(){ return (new Date().getDay()+6)%7; }

/* ---------- slot card markup (shared by Сегодня/Неделя) ---------- */
function slotCardHtml(dayIndex, slotKey, slot){
  if(!slot){

  }

  return (
    '<div class="slot-card" style="border-left-color:var(--cat-'+slotKey+')">'+
      '<div class="meta">'+
        '<div class="slot-type" style="color:var(--cat-'+slotKey+')">'+SLOT_LABEL[slotKey]+'</div>'+
        '<div class="slot-name">'+escapeHtml(d.name)+'</div>'+
        '<div class="slot-time">'+d.totalTime+' мин'+(d.activeTime<d.totalTime ? ' (активных '+d.activeTime+')' : '')+' · '+slot.servings+' порц.'+(d.canPrepAhead?' · можно заранее':'')+'</div>'+
      '</div>'+
      '<button class="icon-btn" data-replace="'+dayIndex+':'+slotKey+'" title="Заменить" aria-label="Заменить блюдо"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M17 2.5 21 6l-4 3.5M21 6H8a5 5 0 0 0-5 5v1M7 21.5 3 18l4-3.5M3 18h13a5 5 0 0 0 5-5v-1"/></svg></button>'+
      '<a class="icon-btn" href="#dish-'+d.id+'" title="Открыть рецепт" aria-label="Открыть рецепт" style="text-decoration:none;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 6 15 12 9 18"/></svg></a>'+

function bindSlotActions(container, afterChange){
  Array.prototype.forEach.call(container.querySelectorAll('[data-replace]'), function(btn){
    btn.addEventListener('click', function(){
      var parts = btn.getAttribute('data-replace').split(':');
      replaceDishInSlot(Number(parts[0]), parts[1]);
      afterChange();
    });
  });
}

function balanceBlockHtml(totals, targets){
  var kcalPct = pct(totals.kcal, targets.kcal);
  var over = kcalPct > 115;
  var rows = [
    ['Белки', totals.protein, targets.protein, 'г'],
    ['Жиры', totals.fat, targets.fat, 'г'],
    ['Углеводы', totals.carb, targets.carb, 'г']
  ];
  return (
    '<div class="card stack">'+
      '<div class="section-title"><h2>Баланс · на '+state.members.length+' '+peopleWord(state.members.length)+'</h2><span class="mono" style="font-weight:600;">'+Math.round(totals.kcal)+' / '+Math.round(targets.kcal)+' ккал</span></div>'+
      '<div class="balance-row"><div class="balance-track"><div class="balance-fill'+(over?' over':'')+'" style="width:'+Math.min(100,kcalPct)+'%"></div></div><span class="mono" style="font-size:12px; color:var(--ink-soft); width:38px; text-align:right;">'+kcalPct+'%</span></div>'+
      '<div class="macro-grid">'+
        rows.map(function(r){ return '<div><div class="mval">'+Math.round(r[1])+r[3]+'</div><div class="mlabel">'+r[0]+' · '+pct(r[1],r[2])+'%</div></div>'; }).join('')+
      '</div>'+
      (state.members.length>1 ?
        '<details><summary style="cursor:pointer; color:var(--ink-soft); font-size:13px;">Норма ккал по жителям</summary>'+
          '<div class="stack" style="margin-top:8px;">'+state.members.map(memberTargetRowHtml).join('')+'</div>'+
        '</details>' : '')+
    '</div>'
  );
}

/* ---------- Сегодня ---------- */
function renderToday(app){
  if(!state.currentMenu){
    app.innerHTML = '<div class="empty stack"><h2>Меню ещё не собрано</h2><p>Нажмите, чтобы собрать меню на неделю по вашим ответам.</p><button class="btn btn-primary" id="build-menu">Собрать меню</button></div>';
    document.getElementById('build-menu').addEventListener('click', function(){ buildMenu(false); renderToday(app); });
    return;
  }
  var di = todayIndex();
  var day = state.currentMenu.days[di];
  var totals = dayTotals(day);
  var targets = state.currentMenu.targets;
  var warnings = targets.warnings || [];
  var gapsToday = state.currentMenu.gaps.filter(function(g){ return g.indexOf(WEEKDAYS_RU[di])===0; });

  var html = '<div class="stack">';
  html += '<p style="color:var(--ink-faint); font-size:13px;">'+WEEKDAYS_RU[di]+(di===state.prepDayIndex ? ' · день заготовок' : '')+'</p>';
  html += '<div class="stack" id="slots-today">'+SLOT_ORDER.filter(function(k){return state.meals[k];}).map(function(k){ return slotCardHtml(di, k, day.slots[k]); }).join('')+'</div>';
  if(gapsToday.length) html += gapsToday.map(function(g){ return '<div class="gap-note">'+escapeHtml(g)+'</div>'; }).join('');
  html += balanceBlockHtml(totals, targets);
  if(warnings.length) html += '<div class="gap-note">'+warnings.map(escapeHtml).join('<br>')+'</div>';
  html += '</div>';
  app.innerHTML = html;
  bindSlotActions(app, function(){ renderToday(app); });
}

/* ---------- Неделя ---------- */
var weekSelectedDay = null;

function renderWeek(app){
  if(!state.currentMenu){
    app.innerHTML = '<div class="empty stack"><h2>Меню ещё не собрано</h2><button class="btn btn-primary" id="build-menu">Собрать меню</button></div>';
    document.getElementById('build-menu').addEventListener('click', function(){ buildMenu(false); renderWeek(app); });
    return;
  }
  if(weekSelectedDay===null) weekSelectedDay = todayIndex();
  var menu = state.currentMenu;
  var short = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];

  var weekSum = {}; NUTRIENT_KEYS.forEach(function(k){ weekSum[k]=0; });
  menu.days.forEach(function(day){ var t = dayTotals(day); NUTRIENT_KEYS.forEach(function(k){ weekSum[k]+=t[k]; }); });
  var weekAvgProteinPct = pct(weekSum.protein/7, menu.targets.protein);
  var microRows = Object.keys(MICRO_LABELS).map(function(k){
    var avgPct = pct(weekSum[k]/7, menu.targets.micro[k]);
    return '<div class="row" style="justify-content:space-between;"><span style="color:var(--ink-soft); font-size:13px;">'+MICRO_LABELS[k]+'</span><span class="mono" style="font-weight:600; font-size:13px;">'+avgPct+'%</span></div>';
  }).join('');

  var day = menu.days[weekSelectedDay];
  var totals = dayTotals(day);

  var html = '<div class="stack">';
  html += '<div class="row" style="gap:8px;">'+
      '<button class="btn btn-ghost btn-sm" id="regen-week" style="flex:1;">Собрать заново</button>'+
      '<button class="btn btn-primary btn-sm" id="next-week" style="flex:1;">Следующая неделя</button>'+
    '</div>';
  html += '<div class="daystrip" id="day-strip">'+menu.days.map(function(d,i){
      return '<button data-day="'+i+'" class="'+(i===weekSelectedDay?'active':'')+(i===todayIndex()?' mono':'')+'">'+short[i]+(i===todayIndex()?'<span class="dnum">•</span>':'<span class="dnum">&nbsp;</span>')+'</button>';
    }).join('')+'</div>';
  html += '<div class="stack" id="slots-week">'+SLOT_ORDER.filter(function(k){return state.meals[k];}).map(function(k){ return slotCardHtml(weekSelectedDay, k, day.slots[k]); }).join('')+'</div>';
  html += balanceBlockHtml(totals, menu.targets);
  html += '<div class="card stack"><h2>За неделю</h2>'+
      '<div class="row" style="justify-content:space-between;"><span style="color:var(--ink-soft); font-size:13px;">Белок в среднем за день</span><span class="mono" style="font-weight:600; font-size:13px;">'+weekAvgProteinPct+'%</span></div>'+
      '<hr class="hairline">'+microRows+
    '</div>';
  if(menu.gaps.length) html += '<div class="gap-note">'+menu.gaps.map(escapeHtml).join('<br>')+'</div>';
  html += '</div>';
  app.innerHTML = html;

  Array.prototype.forEach.call(document.getElementById('day-strip').querySelectorAll('button'), function(btn){
    btn.addEventListener('click', function(){ weekSelectedDay = Number(btn.getAttribute('data-day')); renderWeek(app); });
  });
  bindSlotActions(app, function(){ renderWeek(app); });
  document.getElementById('regen-week').addEventListener('click', function(){ buildMenu(false); weekSelectedDay = todayIndex(); toast('Меню собрано заново'); renderWeek(app); });
  document.getElementById('next-week').addEventListener('click', function(){ buildMenu(true); weekSelectedDay = todayIndex(); toast('Новая неделя готова'); renderWeek(app); });
}

  html += '<div class="card stack"><h2>Ингредиенты · на '+d.servingsBase+' порц.</h2>'+

/* ---------- Библиотека блюд ---------- */
var libraryFilters = { q:'', type:'all', favOnly:false, feasibleOnly:false };
var LIB_TYPE_TABS = [['all','Все'],['breakfast','Завтрак'],['main','Обед/ужин'],['snack','Перекус']];

function dishEquipmentOk(d){
  if(d.equipment.indexOf('oven')>-1 && !state.equipment.oven) return false;
  if(d.equipment.indexOf('blender')>-1 && !state.equipment.blender) return false;
  if(d.equipment.indexOf('multicooker')>-1 && !state.equipment.multicooker) return false;
  return true;
}

function dishMatchesSearch(d, q){
  if(!q) return true;
  q = q.toLowerCase();
  if(d.name.toLowerCase().indexOf(q)>-1) return true;
  return d.ing.some(function(it){ return INGREDIENTS[it.id].name.toLowerCase().indexOf(q)>-1; });
}

function renderLibrary(app){
  var html = '<div class="stack">';
  html += '<div class="search-input"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg><input type="text" id="lib-search" placeholder="Поиск по названию или продукту" value="'+escapeHtml(libraryFilters.q)+'"></div>';
  html += '<div class="row wrap" id="lib-type-chips">'+LIB_TYPE_TABS.map(function(t){ return '<span class="chip'+(libraryFilters.type===t[0]?' active':'')+'" data-type="'+t[0]+'">'+t[1]+'</span>'; }).join('')+'</div>';
  html += '<div class="row wrap">'+
      '<span class="chip'+(libraryFilters.favOnly?' active':'')+'" id="lib-fav-toggle">Избранное</span>'+
      '<span class="chip'+(libraryFilters.feasibleOnly?' active':'')+'" id="lib-feasible-toggle">По моему оборудованию</span>'+
    '</div>';
  html += '<div class="stack" id="lib-results"></div>';
  html += '</div>';
  app.innerHTML = html;

  function renderResults(){
    var list = DISH_LIST.filter(function(d){
      if(libraryFilters.type!=='all' && d.type!==libraryFilters.type) return false;
      if(libraryFilters.favOnly && state.favorites.indexOf(d.id)===-1) return false;
      if(libraryFilters.feasibleOnly && !dishEquipmentOk(d)) return false;
      if(!dishMatchesSearch(d, libraryFilters.q)) return false;
      return true;
    });
    var results = document.getElementById('lib-results');
    if(!list.length){ results.innerHTML = '<div class="empty"><p>Ничего не нашлось. Попробуйте изменить поиск или фильтры.</p></div>'; return; }
    results.innerHTML = list.map(function(d){
      var flags = dishFlags(d);
      var per = dishPerServing(d);
      var isFav = state.favorites.indexOf(d.id)>-1;
      var isExcluded = state.excludedDishes.indexOf(d.id)>-1;
      var badges = [];
      if(flags.vegan) badges.push('веган'); else if(flags.vegetarian) badges.push('вег.');
      if(flags.glutenFree) badges.push('без глютена');
      if(flags.hasVeg) badges.push('с овощами');
      var catKey = d.type==='main' ? 'lunch' : d.type;
      return (
        '<a class="lib-card" href="#dish-'+d.id+'" data-dish="'+d.id+'" style="border-left-color:var(--cat-'+catKey+')">'+
          '<div class="lib-top">'+
            '<div><div class="lib-name">'+escapeHtml(d.name)+'</div>'+
            '<div class="lib-meta"><span style="color:var(--cat-'+catKey+'); font-weight:600;">'+SLOT_LABEL[d.type==='main'?'lunch':d.type]+'</span> · '+d.totalTime+' мин · '+Math.round(per.kcal)+' ккал/порц.'+(badges.length?' · '+badges.join(', '):'')+'</div></div>'+
            '<div class="lib-actions">'+
              '<button class="star-btn'+(isFav?' active':'')+'" data-fav="'+d.id+'" title="Избранное" aria-label="Избранное"><svg viewBox="0 0 24 24" fill="'+(isFav?'currentColor':'none')+'" stroke="currentColor" stroke-width="1.6"><path d="M12 3.5 14.7 9l6 .9-4.4 4.2 1 6-5.3-2.8L6.7 20.1l1-6-4.4-4.2 6-.9Z"/></svg></button>'+
              '<button class="eye-btn'+(isExcluded?' active':'')+'" data-exclude="'+d.id+'" title="Не предлагать" aria-label="Не предлагать"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 3l18 18M10.6 10.6a2 2 0 0 0 2.8 2.8M6.5 6.9C4.3 8.3 2.7 10.3 2 12c1.4 3.3 5 7 10 7 1.8 0 3.4-.5 4.8-1.3M9.9 4.2A10.6 10.6 0 0 1 12 4c5 0 8.6 3.7 10 7a12.6 12.6 0 0 1-2.3 3.5"/></svg></button>'+
            '</div>'+
          '</div>'+
        '</a>'
      );
    }).join('');

    Array.prototype.forEach.call(results.querySelectorAll('[data-fav]'), function(btn){
      btn.addEventListener('click', function(e){
        e.preventDefault(); e.stopPropagation();
        var id = btn.getAttribute('data-fav');
        var i = state.favorites.indexOf(id);
        if(i>-1) state.favorites.splice(i,1); else state.favorites.push(id);
        saveState(); renderResults();
      });
    });
    Array.prototype.forEach.call(results.querySelectorAll('[data-exclude]'), function(btn){
      btn.addEventListener('click', function(e){
        e.preventDefault(); e.stopPropagation();
        var id = btn.getAttribute('data-exclude');
        var i = state.excludedDishes.indexOf(id);
        if(i>-1) state.excludedDishes.splice(i,1); else state.excludedDishes.push(id);

        toast(i>-1 ? 'Снова предлагается в меню' : 'Больше не предлагается в меню');

  renderResults();
  document.getElementById('lib-search').addEventListener('input', function(e){ libraryFilters.q = e.target.value; renderResults(); });
  Array.prototype.forEach.call(document.getElementById('lib-type-chips').querySelectorAll('.chip'), function(chip){
    chip.addEventListener('click', function(){
      libraryFilters.type = chip.getAttribute('data-type');
      Array.prototype.forEach.call(document.getElementById('lib-type-chips').querySelectorAll('.chip'), function(c){ c.classList.remove('active'); });
      chip.classList.add('active');
      renderResults();
    });
  });
  document.getElementById('lib-fav-toggle').addEventListener('click', function(){
    libraryFilters.favOnly = !libraryFilters.favOnly;
    this.classList.toggle('active');
    renderResults();
  });
  document.getElementById('lib-feasible-toggle').addEventListener('click', function(){
    libraryFilters.feasibleOnly = !libraryFilters.feasibleOnly;
    this.classList.toggle('active');
    renderResults();
  });
}

/* ---------- Покупки ---------- */
var CAT_ORDER = ['Овощи и зелень','Фрукты','Мясо, птица и рыба','Молочное и яйца','Бакалея и крупы','Хлеб и выпечка','Масла, орехи и соусы'];

function computeShoppingList(){
  var totals = {};
  state.currentMenu.days.forEach(function(day){
    SLOT_ORDER.forEach(function(k){
      var s = day.slots[k];
      if(!s) return;
      DISHES[s.dishId].ing.forEach(function(it){
        totals[it.id] = (totals[it.id]||0) + it.g*s.scale;
      });
    });
  });
  var groups = {};
  Object.keys(totals).forEach(function(id){
    var ing = INGREDIENTS[id];
    (groups[ing.cat] = groups[ing.cat] || []).push({ id:id, name:ing.name, amount:totals[id] });
  });
  Object.keys(groups).forEach(function(cat){ groups[cat].sort(function(a,b){ return a.name.localeCompare(b.name,'ru'); }); });
  return groups;
}

function shoppingCopyText(groups){
  var lines = ['Список покупок — Khadi',''];
  CAT_ORDER.forEach(function(cat){
    var items = (groups[cat]||[]).filter(function(it){ return !state.pantryHave[it.id]; });
    if(!items.length) return;
    lines.push(cat+':');
    items.forEach(function(it){ lines.push('- '+it.name+' — '+formatAmount(it.id, it.amount)); });
    lines.push('');
  });
  return lines.join('\n').trim();
}

function copyToClipboard(text){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){ toast('Список скопирован'); }).catch(function(){ fallbackCopy(text); });
  } else { fallbackCopy(text); }
}
function fallbackCopy(text){
  try{
    var ta = document.createElement('textarea');
    ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    var ok = false;
    try{ ok = document.execCommand('copy'); }catch(e){}
    document.body.removeChild(ta);
    toast(ok ? 'Список скопирован' : 'Не удалось скопировать — выделите текст вручную');
  }catch(e){ toast('Не удалось скопировать — выделите текст вручную'); }
}

function renderShopping(app){
  if(!state.currentMenu){
    app.innerHTML = '<div class="empty stack"><h2>Сначала соберите меню</h2><p>Список покупок строится по меню на неделю.</p></div>';
    return;
  }
  var groups = computeShoppingList();
  var html = '<div class="stack">';
  html += '<button class="btn btn-primary" id="copy-shopping">Скопировать список</button>';
  var any = false;
  CAT_ORDER.forEach(function(cat){
    var items = groups[cat];
    if(!items || !items.length) return;
    any = true;
    html += '<div class="card stack"><h2>'+escapeHtml(cat)+'</h2><div>'+
      items.map(function(it){
        var checked = !!state.pantryHave[it.id];
        return '<div class="shop-row'+(checked?' checked':'')+'" data-pantry="'+it.id+'">'+
          '<span class="shop-check">'+(checked?'<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M4 12l5 5L20 6"/></svg>':'')+'</span>'+
          '<span class="shop-name">'+escapeHtml(it.name)+'</span>'+
          '<span class="shop-amount">'+formatAmount(it.id, it.amount)+'</span>'+
        '</div>';
      }).join('')+
      '</div></div>';
  });
  if(!any) html += '<div class="empty"><p>Список пуст.</p></div>';
  html += '<p style="font-size:12px;">Отмеченное «есть дома» не попадёт в скопированный список.</p>';
  html += '</div>';
  app.innerHTML = html;
  document.getElementById('copy-shopping').addEventListener('click', function(){ copyToClipboard(shoppingCopyText(groups)); });
  Array.prototype.forEach.call(app.querySelectorAll('[data-pantry]'), function(row){
    row.addEventListener('click', function(){
      var id = row.getAttribute('data-pantry');
      state.pantryHave[id] = !state.pantryHave[id];
      saveState();
      row.classList.toggle('checked');
      row.querySelector('.shop-check').innerHTML = state.pantryHave[id] ? '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M4 12l5 5L20 6"/></svg>' : '';
    });
  });
}

/* ---------- Заготовки ---------- */
function collectPrepInfo(menu){
  var prepMap = {};
  var quickIds = {};
  menu.days.forEach(function(day, i){
    var isWeekend = i>=5;
    SLOT_ORDER.forEach(function(k){
      var s = day.slots[k];
      if(!s) return;
      var d = DISHES[s.dishId];
      if(d.canPrepAhead){ (prepMap[d.id] = prepMap[d.id] || []).push(i); }
      if(!isWeekend && (k==='lunch'||k==='dinner') && d.totalTime<=20){ quickIds[d.id]=true; }
    });
  });
  return { prepMap:prepMap, quickIds:Object.keys(quickIds) };
}

function renderPrep(app){
  if(!state.currentMenu){
    app.innerHTML = '<div class="empty stack"><h2>Сначала соберите меню</h2><p>План заготовок строится по меню на неделю.</p></div>';
    return;
  }
  var menu = state.currentMenu;
  var info = collectPrepInfo(menu);
  var prepIds = Object.keys(info.prepMap);

  var html = '<div class="stack">';
  html += '<div class="card stack"><h2>День заготовок — '+WEEKDAYS_RU[state.prepDayIndex]+'</h2>';
  if(prepIds.length){
    html += prepIds.map(function(id){
      var d = DISHES[id];
      var days = info.prepMap[id].map(function(i){ return WEEKDAYS_RU[i].slice(0,2); }).join(', ');
      return '<div class="prep-item"><span>'+escapeHtml(d.name)+'</span><span class="mono" style="font-size:12px; color:var(--ink-soft);">'+days+(d.storageDays?(' · '+d.storageDays+' дн.'):'')+'</span></div>';
    }).join('');
  } else {
    html += '<p>На этой неделе нет блюд с пометкой «можно приготовить заранее». Попробуйте собрать меню заново — состав может измениться.</p>';
  }
  html += '</div>';

  html += '<div class="card stack"><h2>Быстро в будни (до 20 мин)</h2>';
  if(info.quickIds.length){
    html += info.quickIds.map(function(id){
      var d = DISHES[id];
      return '<div class="prep-item"><span>'+escapeHtml(d.name)+'</span><span class="mono" style="font-size:12px; color:var(--ink-soft);">'+d.totalTime+' мин</span></div>';
    }).join('');
  } else {
    html += '<p>На этой неделе быстрых будничных блюд не попалось.</p>';
  }
  html += '</div>';

  html += '<div class="card stack"><h2>Расписание на неделю</h2>';
  html += menu.days.map(function(day, i){
    var lines = SLOT_ORDER.filter(function(k){ return state.meals[k] && day.slots[k]; }).map(function(k){
      var d = DISHES[day.slots[k].dishId];
      return '<div class="sd-line"><span>'+SLOT_LABEL[k]+': '+escapeHtml(d.name)+'</span><span>'+d.totalTime+' мин</span></div>';
    }).join('');
    return '<div class="schedule-day"><div class="sd-head"><span>'+WEEKDAYS_RU[i]+'</span>'+(i===state.prepDayIndex?'<span class="pill">заготовки</span>':'')+'</div>'+lines+'</div>';
  }).join('');
  html += '</div>';
  html += '</div>';
  app.innerHTML = html;
}

route();
</script>
